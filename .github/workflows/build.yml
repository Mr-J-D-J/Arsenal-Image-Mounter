name: Build Arsenal Image Mounter GUI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 配置 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        # 项目里有 net10.0-windows，使用最新的 .NET 9 SDK 保证兼容性
        dotnet-version: '9.0.x'

    - name: 3. 动态查找并发布 GUI 程序
      shell: pwsh
      run: |
        Write-Host "==================== 开始搜索 GUI 项目 ===================="
        
        # 动态搜索 Managed Source 下的 Forms 项目，彻底避免路径拼写错误
        $guiProj = Get-ChildItem -Path "Managed Source" -Recurse -Filter "*Forms*.csproj" | Select-Object -First 1
        
        if (-not $guiProj) {
          Write-Error "❌ 未在 Managed Source 下找到 Forms 项目文件！请检查目录结构。"
          exit 1
        }
        
        Write-Host "✅ 找到 GUI 项目路径: $($guiProj.FullName)"
        Write-Host "==================== 开始发布 GUI ===================="
        
        # 执行发布
        # -f net10.0-windows：指定框架（之前日志已确认支持）
        # -p:OutputType=WinExe：强制将其编译为 Windows 可执行程序（.exe），防止它默认编译成类库
        dotnet publish $guiProj.FullName -c Release -f net10.0-windows -r win-x64 --self-contained true -p:OutputType=WinExe -o ./publish/GUI
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ GUI 发布失败！请查看上方日志。"
          exit 1
        }
        
        Write-Host "✅ GUI 发布成功！"

    - name: 4. 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ArsenalImageMounter-GUI
        path: |
          ./publish/GUI/**
        if-no-files-found: warn
