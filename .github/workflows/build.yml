name: Build Arsenal Image Mounter Executables

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-managed:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 3. Publish GUI and CLI
      shell: pwsh
      run: |
        $guiProj = "Managed Source\Arsenal.ImageMounter.Forms\Arsenal.ImageMounter.Forms.csproj"
        Write-Host "==== Start publishing GUI ===="
        if (Test-Path $guiProj) {
          Write-Host "Found GUI project: $guiProj"
          dotnet publish $guiProj -c Release -f net10.0-windows -r win-x64 --self-contained true -o ./publish/GUI
          if ($LASTEXITCODE -ne 0) { Write-Error "GUI publish failed"; exit 1 }
        } else {
          Write-Error "GUI project not found at: $guiProj"
          exit 1
        }

        $cliDir = "Command line applications"
        $cliProj = $null
        Write-Host "==== Start publishing CLI ===="
        if (Test-Path $cliDir) {
          Write-Host "Searching for csproj in $cliDir..."
          $cliProj = Get-ChildItem -Path $cliDir -Recurse -Filter "*.csproj" | Where-Object { $_.Name -notmatch 'Setup' } | Select-Object -First 1
        }

        if ($cliProj) {
          Write-Host "Found CLI project: $($cliProj.FullName)"
          dotnet publish $cliProj.FullName -c Release -f net10.0-windows -r win-x64 --self-contained true -o ./publish/CLI
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI publish failed"; exit 1 }
        } else {
          Write-Warning "CLI project not found in $cliDir."
          if (Test-Path $cliDir) {
            Get-ChildItem -Path $cliDir -Recurse -File | Select-Object -First 10 | ForEach-Object { Write-Host " - $($_.FullName)" }
          } else {
            Write-Host "Directory $cliDir does not exist."
          }
        }

    - name: 4. Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArsenalImageMounter-Executables
        path: |
          ./publish/**
        if-no-files-found: warn
