name: Build Arsenal Image Mounter (Managed .NET)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-managed:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 配置 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        # 项目截图显示有 ".NET 11 adjustments"，考虑到官方文档建议 6/7/8，这里使用 8.0 以确保高版本兼容性
        dotnet-version: '8.0.x'

    - name: 3. 指定路径并构建解决方案
      shell: pwsh
      run: |
        # 直接拼接出基于截图的确切路径
        $slnPath = Join-Path $PWD "Managed Source\ArsenalImageMounter.sln"
        
        # 检查这个绝对路径的文件是否存在
        if (Test-Path $slnPath) {
          Write-Host "成功找到解决方案文件，准备开始构建: $slnPath"
          Write-Host "==================================================="
          
          # 执行构建
          dotnet build $slnPath --configuration Release
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "构建失败！"
            exit 1
          }
        } else {
          Write-Host "【排错信息】未找到指定的文件: $slnPath"
          Write-Host "当前工作目录是: $PWD"
          Write-Host "尝试列出当前目录下所有 .sln 文件："
          # 如果还是找不到，打印出真实存在的 .sln 以便排查
          Get-ChildItem -Path . -Recurse -Include *.sln, *.slnx | ForEach-Object { Write-Host $_.FullName }
          Write-Error "构建终止：无法确定 .sln 路径。"
          exit 1
        }

    - name: 4. 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ArsenalImageMounter-Managed-Build
        path: |
          **/bin/Release/**
