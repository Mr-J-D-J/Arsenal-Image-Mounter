name: Build Arsenal Image Mounter Executables

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-executables:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 配置 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 3. 动态查找并发布可执行程序
      shell: pwsh
      run: |
        $publishRoot = "$PWD/publish"
        $foundAny = $false

        # 递归扫描整个仓库的所有 .csproj 文件
        $allProjects = Get-ChildItem -Path $PWD -Recurse -Filter "*.csproj"

        foreach ($proj in $allProjects) {
          # 跳过安装包项目（Setup）
          if ($proj.Name -match 'Setup') { continue }

          Write-Host "正在检查项目: $($proj.FullName)"

          # 读取项目文件的 XML 内容，判断 OutputType
          try {
            [xml]$projXml = Get-Content $proj.FullName
            $outputType = $projXml.Project.PropertyGroup.OutputType
            if (-not $outputType) { $outputType = $projXml.Project.PropertyGroup.OutputType } # 处理多 PropertyGroup 的情况

            # 只发布 OutputType 为 WinExe（GUI）或 Exe（控制台）的项目
            if ($outputType -match 'WinExe|Exe') {
              $projName = [System.IO.Path]::GetFileNameWithoutExtension($proj.Name)
              $publishDir = "$publishRoot/$projName"
              
              Write-Host " -> 发现可执行项目 (OutputType: $outputType)，开始发布: $projName"
              
              # 指定目标框架 net10.0-windows 进行发布
              dotnet publish $proj.FullName -c Release -f net10.0-windows -r win-x64 --self-contained true -o $publishDir
              
              if ($LASTEXITCODE -ne 0) {
                Write-Error "发布失败: $($proj.FullName)"
                exit 1
              }
              $foundAny = $true
            } else {
              Write-Host " -> 跳过 (OutputType: $outputType，非可执行程序)"
            }
          } catch {
            Write-Warning "读取项目文件时出错，跳过: $($proj.FullName)"
          }
        }

        if (-not $foundAny) {
          Write-Error "❌ 在整个仓库中未找到任何可执行项目 (OutputType 为 WinExe 或 Exe)。"
          exit 1
        } else {
          Write-Host "✅ 所有可执行程序发布完成！"
        }

    - name: 4. 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ArsenalImageMounter-Executables
        path: |
          ./publish/**
        if-no-files-found: warn
