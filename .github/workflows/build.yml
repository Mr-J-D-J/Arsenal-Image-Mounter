# =============================================================================
# Arsenal Image Mounter — GUI 构建（主工作流，push 自动触发）
# =============================================================================
#
# 为什么构建这个项目
# ------------------
# 仓库里没有独立的 ArsenalImageMounter.exe 主程序：Graphical applications/ 下只有
# "Graphical application moved.txt"，商业版 GUI 已移到 ArsenalRecon.com。
#
# 仓库内真正的可视化挂载工具是 Managed Source/ArsenalImageMounterMountTool：
#   * ArsenalImageMounterMountTool.vbproj 里 <OutputType>WinExe</OutputType>
#   * MainModule.vb 有 Public Sub Main()
#   * MainForm.Designer.vb 是完整挂载界面（Mount raw / DiscUtils / libewf /
#     libaff4 / libqcow、设备列表、RAM disk、Rescan SCSI bus）
#   * MainForm.vb:814 InstallDriver() 会从内嵌的 DriverSetup/DriverFiles.zip
#     自动安装驱动，所以它就是"可视化界面 + 不含开发工具"的成品。
#
# 为什么必须用 .NET 11 SDK
# ------------------------
# Managed Source/Directory.Build.props 里
#   <TargetFrameworks>net48;netstandard2.1;net10.0;net11.0</TargetFrameworks>
# 用 9.x SDK 会直接 NETSDK1045（当前 SDK 不支持目标框架）。
#
# 三个变体（第一个是默认产物：真正的单文件 exe）
# ----------------------------------------------
#   net10-x64-single   【默认】自包含 + 单文件，**就一个 exe，双击即用**，
#                      不需要装任何运行时。两个 exe 各约 57 MB。
#                      打 tag 时还会把这两个 .exe 直接挂到 Release 页面。
#   net48              目标机只要装了 .NET Framework 4.8（Win10 1903+ 自带）即可，
#                      解压后约 13 MB —— 体积最小，但必须整个文件夹一起拷。
#   net10-x64          自包含，不需要任何运行时，解压后约 103 MB，同样是文件夹。
#
# 下载下来的 artifact 长什么样
# ----------------------------
# GitHub 的 upload-artifact 本身就会把上传内容打成一个 zip，所以这里**只上传产物
# 文件夹**，绝不能再上传自己打的 zip —— 否则就成了 "zip 里还有一个 zip"，
# 双击内层时 Windows 资源管理器会误报「受密码保护」（文件其实一点加密都没有）。
#
# 注意：Arsenal.ImageMounter.Forms 是**类库**（没有 Program.cs / Main），
#       不能用 -p:OutputType=WinExe 强行发布成 exe。
# =============================================================================

name: build-gui

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'Third-Party-Licenses/**'
      - 'libewf/**'
      - 'Unmanaged Source/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  DOTNET_SDK_VERSION: '11.0.x'

jobs:
  gui:
    name: GUI (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 默认变体放第一个：单文件 exe，最省事的分发形态。
          - variant: net10-x64-single
            tfm: net10.0-windows
            rid: win-x64
            single: 'true'
          - variant: net48
            tfm: net48
            rid: ''
            single: 'false'
          - variant: net10-x64
            tfm: net10.0-windows
            rid: win-x64
            single: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_SDK_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.vbproj', '**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet --info
          $sdks = dotnet --list-sdks
          if (-not ($sdks | Where-Object { $_ -match '^11\.' })) {
            throw "缺少 11.x SDK。Directory.Build.props 的 TargetFrameworks 含 net11.0，没有 11.x SDK 必然 NETSDK1045。"
          }

          # 稀疏检出 / 部分克隆时容易漏掉这些，提前给出明确报错。
          $required = @(
            'Managed Source/Directory.Build.props',
            'Managed Source/ArsenalImageMounterMountTool/ArsenalImageMounterMountTool.vbproj',
            'Managed Source/ArsenalImageMounterGUISetup/ArsenalImageMounterGUISetup.vbproj',
            'DriverSetup/DriverFiles.zip'
          )
          foreach ($p in $required) {
            if (-not (Test-Path -LiteralPath $p)) { throw "缺少必需文件: $p" }
          }
          Write-Host "DriverFiles.zip = $((Get-Item 'DriverSetup/DriverFiles.zip').Length) 字节（会被内嵌进 exe）"

      - name: Publish MountTool + GUISetup (${{ matrix.variant }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tfm = '${{ matrix.tfm }}'
          $rid = '${{ matrix.rid }}'
          $single = ('${{ matrix.single }}' -eq 'true')
          $variant = '${{ matrix.variant }}'
          $dist = "dist/ArsenalImageMounter-GUI-$variant"

          function Publish-Aim {
            param([string]$Project, [string]$OutDir)

            if (-not (Test-Path -LiteralPath $Project)) { throw "项目文件不存在: $Project" }

            # GeneratePackageOnBuild=false 必须加：Release 下各库项目默认触发 pack，
            # 而 Directory.Build.props 把 PackageOutputPath 设为 $(LocalNuGetPath)（未定义 -> 空路径）。
            $dargs = @(
              'publish', $Project
              '-c', $env:CONFIGURATION
              '-f', $tfm
              '-o', $OutDir
              '-p:GeneratePackageOnBuild=false'
              '-p:DebugType=None'
              '-p:DebugSymbols=false'
            )
            # net48 不支持 RID / self-contained，只有 netX.0 才能指定。
            if ($rid) { $dargs += @('-r', $rid, '--self-contained', 'true') }

            if ($single) {
              # 只加 PublishSingleFile 是不够的：libewf.dll / libqcow.dll 这些是
              # P/Invoke 加载的原生库，默认被排除在单文件之外，运行时找不到会直接崩。
              # 必须同时 IncludeNativeLibrariesForSelfExtract，让它们自解压到临时目录。
              $dargs += @(
                '-p:PublishSingleFile=true'
                '-p:IncludeNativeLibrariesForSelfExtract=true'
                '-p:EnableCompressionInSingleFile=true'
              )
            }

            Write-Host "dotnet $($dargs -join ' ')"
            dotnet @dargs
            if ($LASTEXITCODE -ne 0) { throw "发布失败: $Project (退出码 $LASTEXITCODE)" }

            # 清掉调试符号和文档。注意 PS 5.1 下
            # `Get-ChildItem -Include ... | Remove-Item` 在结果为空时会抛 NullReferenceException，
            # 所以先收集成数组再逐个删。
            $junk = @(Get-ChildItem -LiteralPath $OutDir -Recurse -File -ErrorAction SilentlyContinue |
                      Where-Object { $_.Extension -in '.pdb', '.xml' })
            foreach ($f in $junk) { Remove-Item -LiteralPath $f.FullName -Force -ErrorAction SilentlyContinue }
          }

          Publish-Aim 'Managed Source/ArsenalImageMounterMountTool/ArsenalImageMounterMountTool.vbproj' "$dist/MountTool"
          Publish-Aim 'Managed Source/ArsenalImageMounterGUISetup/ArsenalImageMounterGUISetup.vbproj' "$dist/DriverSetup"

          if ($single) {
            # 单文件发布：两个 exe 提到 dist 根目录，其余（已被打包进 exe 的 dll）全删掉。
            foreach ($rel in @('MountTool/ArsenalImageMounterMountTool.exe',
                               'DriverSetup/ArsenalImageMounterGUISetup.exe')) {
              $src = Join-Path $dist $rel
              if (-not (Test-Path -LiteralPath $src)) { throw "单文件发布未产出预期文件: $src" }
              Move-Item -LiteralPath $src -Destination $dist -Force
            }
            foreach ($sub in @('MountTool', 'DriverSetup')) {
              $p = Join-Path $dist $sub
              if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force }
            }
          }

          # 这里用字符串数组而不是 here-string：here-string 的结束符 "@ 必须顶格写，
          # 而 YAML 块标量要求所有续行都有缩进，顶格会直接把 YAML 解析搞崩。
          if ($single) {
            $readme = @(
              "Arsenal Image Mounter — GUI 单文件版 ($variant)"
              '================================================='
              ''
              'ArsenalImageMounterMountTool.exe'
              '    可视化挂载工具。单文件，直接双击运行，首次启动会提示安装虚拟 SCSI 驱动'
              '    （驱动已内嵌在 exe 里，来自 DriverSetup/DriverFiles.zip，无需联网）。'
              '    需要管理员权限。'
              ''
              'ArsenalImageMounterGUISetup.exe'
              '    独立的驱动安装/卸载器，同样是单文件。'
              ''
              '系统要求'
              '    仅支持 Windows x64。'
              ''
              '运行时依赖'
              '    无。自包含 + 单文件，不需要预装任何 .NET 运行时。'
              ''
              '注意'
              '    首次启动会把原生库（libewf / libqcow / libaff4 等）自解压到'
              '    %TEMP%\.net\ 下，因此会慢一两秒；之后有缓存就快了。'
              '    这是单文件发布的固有行为，不是故障。'
              ''
              '说明'
              '    仓库 Graphical applications/ 下只有 "Graphical application moved.txt"，'
              '    带商业功能的 ArsenalImageMounter.exe 主程序已移至 https://ArsenalRecon.com 。'
              '    本包内是仓库内真实存在的开源 GUI 工具（ArsenalImageMounterMountTool）。'
            )
          }
          else {
            $readme = @(
              "Arsenal Image Mounter — GUI ($variant)"
              '========================================'
              ''
              'MountTool\ArsenalImageMounterMountTool.exe'
              '    可视化挂载工具。直接双击运行，首次启动会提示安装虚拟 SCSI 驱动'
              '    （驱动已内嵌在 exe 里，来自 DriverSetup/DriverFiles.zip，无需联网）。'
              '    需要管理员权限。'
              ''
              '    ！！注意：必须保留 MountTool 目录下所有 dll，不能只拷 exe。'
              '    原生库（libewf / libqcow / libaff4 / bzip2 等）由 P/Invoke 加载，'
              '    合并不进托管程序集。想要单文件版请用 net10-x64-single 变体。'
              ''
              'DriverSetup\ArsenalImageMounterGUISetup.exe'
              '    独立的驱动安装/卸载器。只想装驱动、不想开挂载界面时用它。'
              ''
              '系统要求'
              '    仅支持 Windows x64。'
              ''
              '运行时依赖'
              '    net48 变体：需要 .NET Framework 4.8（Windows 10 1903 及以上系统自带）。'
              '    net10-x64 变体：自包含发布，不需要预装任何 .NET 运行时。'
              ''
              '说明'
              '    仓库 Graphical applications/ 下只有 "Graphical application moved.txt"，'
              '    带商业功能的 ArsenalImageMounter.exe 主程序已移至 https://ArsenalRecon.com 。'
              '    本包内是仓库内真实存在的开源 GUI 工具（ArsenalImageMounterMountTool）。'
            )
          }
          Set-Content -LiteralPath "$dist/README.txt" -Value $readme -Encoding UTF8

          Write-Host '--- 产物 ---'
          Get-ChildItem -LiteralPath $dist -Recurse -File |
            ForEach-Object { Write-Host ("  {0,-46} {1,12:N0}" -f $_.Name, $_.Length) }

      # 只上传产物文件夹，不再自己打 zip。
      # 原因：upload-artifact 一定会把上传内容再包一层 zip，如果再上传一个 .zip，
      # 用户拿到的就是 "zip 里还有 zip"，双击内层时资源管理器会弹「受密码保护」。
      - name: Upload ${{ matrix.variant }}（单文件，解压即得 exe）
        if: matrix.single == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ArsenalImageMounter-GUI-${{ matrix.variant }}
          path: dist/ArsenalImageMounter-GUI-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload ${{ matrix.variant }}（文件夹版）
        if: matrix.single != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ArsenalImageMounter-GUI-${{ matrix.variant }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    needs: gui
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          $releaseFiles = (New-Item -ItemType Directory -Force -Path 'release-files').FullName
          $stageRoot = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null

          foreach ($v in @('net10-x64-single', 'net48', 'net10-x64')) {
            $name = "ArsenalImageMounter-GUI-$v"
            $src = Join-Path 'artifacts' $name
            if (-not (Test-Path -LiteralPath $src)) { throw "缺少 artifact: $name" }

            # upload-artifact 是否保留顶层文件夹取决于上传路径，这里统一归一化：
            # 内容一律摊平到 stage/<name>/ 下，保证打出来的 zip 顶层永远是一个干净文件夹。
            $stage = Join-Path $stageRoot $name
            if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            $inner = Join-Path $src $name
            $from = if (Test-Path -LiteralPath $inner) { $inner } else { $src }
            Copy-Item -Path (Join-Path $from '*') -Destination $stage -Recurse -Force

            $zip = Join-Path $releaseFiles "$name.zip"
            if (Test-Path -LiteralPath $sevenZip) {
              Push-Location $stageRoot
              try {
                & $sevenZip a -tzip -mx=5 $zip $name | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "7z 打包失败: $name (退出码 $LASTEXITCODE)" }
              }
              finally { Pop-Location }
            }
            else {
              Compress-Archive -Path $stage -DestinationPath $zip -Force
            }

            $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            "$hash  $name.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII

            # 单文件变体额外把两个 exe 单独挂出来，Release 页面可以直接下 .exe。
            if ($v -eq 'net10-x64-single') {
              $exes = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter *.exe)
              if ($exes.Count -eq 0) { throw "单文件变体里没有 exe" }
              foreach ($e in $exes) { Copy-Item -LiteralPath $e.FullName -Destination $releaseFiles -Force }
            }
          }

          Get-ChildItem -LiteralPath $releaseFiles | Select-Object Name, Length |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
