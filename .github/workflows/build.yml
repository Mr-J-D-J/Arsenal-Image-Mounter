name: Build Arsenal Image Mounter (Managed .NET)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-managed:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 配置 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: 3. 查找并构建所有托管解决方案
      shell: pwsh
      run: |
        Write-Host "开始全局查找 .sln 文件..."
        
        # 找遍全仓库的 .sln 文件，但是强行过滤掉名字里带有 "Unmanaged Source" 的路径
        $solutions = Get-ChildItem -Path . -Recurse -Filter *.sln | Where-Object { $_.FullName -notmatch 'Unmanaged Source' }

        if (-not $solutions) {
          Write-Error "错误：未找到任何 C# 的 .sln 文件！"
          exit 1
        }

        # 循环构建找到的每一个 .sln（GUI 和 CLI 通常是分开的）
        foreach ($sln in $solutions) {
          Write-Host "==================================================="
          Write-Host "正在构建解决方案: $($sln.FullName)"
          Write-Host "==================================================="
          
          dotnet build $sln.FullName --configuration Release
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "构建失败: $($sln.FullName)"
            exit 1
          }
        }
        
        Write-Host "所有托管代码构建完成！"

    - name: 4. 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ArsenalImageMounter-Managed-Build
        path: |
          **/bin/Release/**
