# =============================================================================
# Arsenal Image Mounter — 全量构建（手动触发 / 每周定时）
# =============================================================================
#
# 与 build.yml 的分工
# -------------------
#   build.yml       push 自动跑，只出"可视化界面"成品，最快拿到可用包。
#   build-all.yml   手动或定时跑，出仓库里全部可发布的托管产物。
#
# 这个工作流包含 build.yml 的全部内容（MountTool + GUISetup），另外加上：
#   * aim_cli                       命令行工具（AssemblyName 就是 aim_cli）
#   * ArsenalImageMounterAnalyze    磁盘镜像分析工具（slnx 中固定 x86）
#   * ArsenalRecon.ImageMounter     NuGet 包
#   * Arsenal.ImageMounter.PowerShell   PowerShell 模块
#
# 所有 项目 / TFM / RID 组合都是按仓库真实结构逐一实测过的。
# =============================================================================

name: build-all

on:
  workflow_dispatch:
    inputs:
      include_tests:
        description: '同时运行单元测试（需管理员权限 + 已装驱动，默认关闭）'
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  DOTNET_SDK_VERSION: '11.0.x'

jobs:
  # ---------------------------------------------------------------- 可执行程序
  apps:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 可视化界面（同 build.yml）---
          - name: gui-net48
            project: 'Managed Source/ArsenalImageMounterMountTool/ArsenalImageMounterMountTool.vbproj'
            tfm: net48
            rid: ''
          - name: gui-net10-x64
            project: 'Managed Source/ArsenalImageMounterMountTool/ArsenalImageMounterMountTool.vbproj'
            tfm: net10.0-windows
            rid: win-x64

          # --- 驱动安装器 ---
          - name: guisetup-net48
            project: 'Managed Source/ArsenalImageMounterGUISetup/ArsenalImageMounterGUISetup.vbproj'
            tfm: net48
            rid: ''
          - name: clisetup-net10-x86
            project: 'Managed Source/ArsenalImageMounterCLISetup/ArsenalImageMounterCLISetup.csproj'
            tfm: net10.0-windows
            rid: win-x86

          # --- 命令行工具 aim_cli（AssemblyName=aim_cli）---
          - name: aim_cli-net10-x64
            project: 'Managed Source/ArsenalImageMounterService/ArsenalImageMounterService.csproj'
            tfm: net10.0
            rid: win-x64
          - name: aim_cli-net48
            project: 'Managed Source/ArsenalImageMounterService/ArsenalImageMounterService.csproj'
            tfm: net48
            rid: ''

          # --- 镜像分析工具。注意 TFM 是 net10.0 而不是 net10.0-windows：
          #     它没有覆盖 TargetFrameworks，继承 net48;netstandard2.1;net10.0;net11.0。
          #     slnx 里把它固定成 x86。---
          - name: analyze-net10-x86
            project: 'Managed Source/ArsenalImageMounterAnalyze/ArsenalImageMounterAnalyze.csproj'
            tfm: net10.0
            rid: win-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_SDK_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.vbproj', '**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdks = dotnet --list-sdks
          $sdks
          if (-not ($sdks | Where-Object { $_ -match '^11\.' })) {
            throw "缺少 11.x SDK。Directory.Build.props 的 TargetFrameworks 含 net11.0，没有 11.x SDK 必然 NETSDK1045。"
          }
          foreach ($p in @('Managed Source/Directory.Build.props', 'DriverSetup/DriverFiles.zip')) {
            if (-not (Test-Path -LiteralPath $p)) { throw "缺少必需文件: $p" }
          }

      - name: Publish ${{ matrix.name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $proj = '${{ matrix.project }}'
          $tfm  = '${{ matrix.tfm }}'
          $rid  = '${{ matrix.rid }}'
          $out  = "dist/${{ matrix.name }}"

          if (-not (Test-Path -LiteralPath $proj)) { throw "项目文件不存在: $proj" }

          # GeneratePackageOnBuild=false 必须加，否则 Release 下库项目会顺带触发 pack，
          # 而 Directory.Build.props 把 PackageOutputPath 设为 $(LocalNuGetPath)（未定义 -> 空路径）。
          $dargs = @(
            'publish', $proj
            '-c', $env:CONFIGURATION
            '-f', $tfm
            '-o', $out
            '-p:GeneratePackageOnBuild=false'
            '-p:DebugType=None'
            '-p:DebugSymbols=false'
          )
          # net48 不支持 RID / self-contained。
          if ($rid) { $dargs += @('-r', $rid, '--self-contained', 'true') }

          Write-Host "dotnet $($dargs -join ' ')"
          dotnet @dargs
          if ($LASTEXITCODE -ne 0) { throw "发布失败 (退出码 $LASTEXITCODE)" }

          # PS 5.1 里空结果的 `Get-ChildItem -Include | Remove-Item` 会抛 NullReferenceException。
          $junk = @(Get-ChildItem -LiteralPath $out -Recurse -File -ErrorAction SilentlyContinue |
                    Where-Object { $_.Extension -in '.pdb', '.xml' })
          foreach ($f in $junk) { Remove-Item -LiteralPath $f.FullName -Force -ErrorAction SilentlyContinue }

          Get-ChildItem -LiteralPath $out -File | Select-Object Name, Length |
            Sort-Object Length -Descending | Select-Object -First 5 |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- 类库 + 模块
  packages:
    name: packages
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_SDK_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: NuGet package (ArsenalRecon.ImageMounter)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proj  = 'Managed Source/Arsenal.ImageMounter/Arsenal.ImageMounter.csproj'
          $nupkg = Join-Path $env:GITHUB_WORKSPACE 'dist/nupkg'
          New-Item -ItemType Directory -Force -Path $nupkg | Out-Null

          # 必须先构建全部 TFM 再 --no-build 打包。
          # 直接 dotnet pack 会报 NU5026：pack 要收录 TargetFrameworks 里每个 TFM
          # （net48/netstandard2.1/net10.0/net11.0）的输出，没构建过的 TFM 目录是空的。
          dotnet build $proj -c $env:CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw "构建失败 (退出码 $LASTEXITCODE)" }

          dotnet pack $proj -c $env:CONFIGURATION --no-build "-p:LocalNuGetPath=$nupkg"
          if ($LASTEXITCODE -ne 0) { throw "打包失败 (退出码 $LASTEXITCODE)" }

          Get-ChildItem -LiteralPath $nupkg | Select-Object Name, Length |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: PowerShell module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 仓库里的 publishps.cmd 循环的是 net48 net8.0 net9.0 net10.0，已经过时；
          # 当前 Arsenal.ImageMounter.PowerShell.csproj 的 TargetFrameworks 是 net48;net10.0;net11.0。
          $proj = 'Managed Source/Arsenal.ImageMounter.PowerShell/Arsenal.ImageMounter.PowerShell.csproj'
          foreach ($tfm in @('net10.0', 'net48')) {
            $out = "dist/powershell/$tfm"
            $dargs = @(
              'publish', $proj
              '-c', $env:CONFIGURATION
              '-f', $tfm
              '-o', $out
              '-p:GeneratePackageOnBuild=false'
              '-p:DebugType=None'
              '-p:DebugSymbols=false'
            )
            Write-Host "dotnet $($dargs -join ' ')"
            dotnet @dargs
            if ($LASTEXITCODE -ne 0) { throw "PowerShell 模块发布失败: $tfm (退出码 $LASTEXITCODE)" }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/nupkg/**
            dist/powershell/**
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- 单元测试
  tests:
    name: tests
    if: inputs.include_tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_SDK_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 必须用 net11.0-windows：只装了 11.x SDK 时机器上只有 11.x 运行时，
          # 跑 net10.0-windows 会因缺少 Microsoft.NETCore.App 10.0.0 导致 testhost 起不来。
          #
          # 另外 TestProject 里 16 个用例固定有 3 个失败（ValidateAuthenticodeWinPE64 /
          # PartitionTests / QueryDefaultReparsePoints），它们需要管理员权限 + 已装驱动，
          # 与构建无关。所以这里不让失败中断工作流，只把结果打出来。
          dotnet test 'Managed Source/TestProject/TestProject.csproj' `
            -c $env:CONFIGURATION -f net11.0-windows --nologo `
            --logger "console;verbosity=normal"
          Write-Host "dotnet test 退出码: $LASTEXITCODE（3 个环境依赖用例失败属预期）"
